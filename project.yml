      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.philippstach.partie.tests.rahmen
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Partie.app/Partie
        BUNDLE_LOADER: $(TEST_HOST)
