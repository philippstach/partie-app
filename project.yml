schemes:
  Rundgang:
    build:
      targets:
        Partie: all
        TestsRundgang: [test]
    test:
      config: Debug
      targets: [TestsRundgang]
  Partie:
    build:
      targets:
        Partie: all
    run:
      config: Debug
    test:
      config: Debug
  AlleSpielTests:
    build:
      targets:
        Partie: all
        TestsYacht: [test]
        TestsRahmen: [test]
        TestsSchocken: [test]
        TestsRauswurf: [test]
        TestsSudoku: [test]
        TestsGalgenmaennchen: [test]
        TestsSolitaer: [test]
        TestsWortpfeil: [test]
        TestsFarbraetsel: [test]
        Tests10k: [test]
    test:
      targets:
        - TestsYacht
        - TestsRahmen
        - TestsSchocken
        - TestsRauswurf
        - TestsSudoku
        - TestsGalgenmaennchen
        - TestsSolitaer
        - TestsWortpfeil
        - TestsFarbraetsel
        - Tests10k
      # Fallback für die Solitär-Listen, falls das Paket als eigenes Framework gebaut wird (siehe DealCatalog.partienBundle)
      environmentVariables:
        PARTIE_PARTIEN: $(SRCROOT)/Pakete/SpielSolitaer/Shared/partien

configFiles:
  Debug: Lokal.xcconfig
  Release: Lokal.xcconfig
