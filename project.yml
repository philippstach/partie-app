targets:
  Partie:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Ressourcen/loesungen", "Ressourcen/raetsel"]
      - path: App/Ressourcen/loesungen
        type: folder
      - path: App/Ressourcen/raetsel
        type: folder
      - path: Widget/Geteilt
    entitlements:
      path: App/Partie.entitlements
      properties:
        com.apple.developer.game-center: true
        com.apple.security.application-groups: [group.de.philippstach.spiele]
        com.apple.developer.icloud-container-identifiers: [iCloud.de.philippstach.partie]
        com.apple.developer.icloud-services: [CloudKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.philippstach.partie
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Partie
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        SWIFT_VERSION: "5.10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "Symbol-yacht Symbol-schocken Symbol-rauswurf Symbol-minensuche Symbol-farbraetsel Symbol-solitaer Symbol-wortpfeil Symbol-sudoku Symbol-viererreihe Symbol-galgenmaennchen Symbol-10k Symbol-aceydeucey Symbol-backgammon Symbol-ballwechsel Symbol-brisca Symbol-bruecken Symbol-bunco Symbol-chicago Symbol-chinchon Symbol-crazyeights Symbol-dame Symbol-dauerlauf Symbol-domino Symbol-dominocubano Symbol-elferraus Symbol-escoba Symbol-esel Symbol-farbcode Symbol-farbflut Symbol-farbwechsel Symbol-flinkhand Symbol-fuchsjagd Symbol-halma Symbol-hanoi Symbol-herzensjagd Symbol-himmelsleiter Symbol-hoelzchen Symbol-irrgang Symbol-kaestchenjagd Symbol-kakuro Symbol-kalaha Symbol-kartenduell Symbol-klappbrett Symbol-koenigsweg Symbol-kreuzwurf Symbol-lagerplatz Symbol-lichteraus Symbol-luegenwuerfel Symbol-maexchen Symbol-mahjongpaare Symbol-mauerbrecher Symbol-maumau Symbol-mogeln Symbol-muehle Symbol-nonogramm Symbol-oware Symbol-paarsuche Symbol-patolli Symbol-pechvogel Symbol-perudo Symbol-pokerwurf Symbol-romme Symbol-schach Symbol-schiebepuzzle Symbol-schiffeversenken Symbol-schiffsfracht Symbol-schweinerei Symbol-schwimmen Symbol-sechseck Symbol-siebzehnundvier Symbol-spitspeed Symbol-stadtlandfluss Symbol-steckspiel Symbol-steinfall Symbol-stufenstapel Symbol-truco Symbol-ungleichung Symbol-wendespiel Symbol-wolkenhuepfer Symbol-zahlenfusion"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: de.philippstach.partie
            CFBundleURLSchemes: [partie]
        NSSupportsLiveActivities: true
        NSFaceIDUsageDescription: Face ID schützt den Kinder-Modus, damit Kinder ihn nicht selbst ausschalten.
        NSMicrophoneUsageDescription: Über das Mikrofon kannst du die Augen deiner echten Würfel ansagen. Der Ton wird auf deinem Gerät ausgewertet und weder gespeichert noch gesendet.
        NSSpeechRecognitionUsageDescription: Die Spracherkennung versteht die angesagten Augenzahlen. Sie läuft auf deinem Gerät, es wird nichts gesendet.
        NSLocalNetworkUsageDescription: Partie verbindet dein iPhone und dein iPad direkt miteinander, damit ein Gerät als Würfelscanner dienen kann. Es werden nur die Augen der Würfel übertragen, keine Bilder.
        NSBonjourServices: [_partie-wuerfel._tcp, _partie-wuerfel._udp]
        NSCameraUsageDescription: Die Kamera erkennt live die Augen deiner echten Würfel. Die Bilder bleiben auf deinem Gerät und werden nicht gesendet. Gespeichert werden sie nur, wenn du in den Einstellungen die Lern-Aufnahme einschaltest.
        UILaunchScreen: {}
    dependencies:
      - target: PartieWidget
        embed: true
      - package: Baukasten
        product: KlarGlas
      - package: Baukasten
        product: Baukasten
