  PartieWidget:
    type: app-extension
    platform: iOS
    sources: [Widget]
    dependencies:
      - package: Baukasten
        product: KlarGlas
    entitlements:
      path: Widget/PartieWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.de.philippstach.spiele]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Partie
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.philippstach.partie.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
  TestsRundgang:
    type: bundle.ui-testing
    platform: iOS
    sources: [Test/Rundgang]
    dependencies:
      - target: Partie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.philippstach.partie.tests.rundgang
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Partie
